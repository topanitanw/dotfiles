onboarding = false

[keys]
previous_agent = "ctrl+alt+p"
next_agent = "ctrl+alt+n"

[[keys.command]]
key = "prefix+E"
type = "plugin_action"
command = "shibayu36.equalize-panes.equalize"
description = "equalize panes"

[theme]
name = "catppuccin"
auto_switch = false

[theme.custom]
accent = "#9FC59F"
panel_bg = "#3F3F3F"
sidebar_bg = "#2B2B2B"
active_row_bg = "#494949"
selection_bg = "#5F5F5F"
surface0 = "#383838"
surface1 = "#494949"
surface_dim = "#303030"
# text color on the sidebar such as spaces, new, menu, agents
overlay0 = "#8FB2AF"
overlay1 = "#989890"
text = "#DCDCCC"
subtext0 = "#989890"
mauve = "#DC8CC3"
green = "#8FB28F"
yellow = "#F0DFAF"
red = "#CC9393"
blue = "#8CD0D3"
teal = "#93E0E3"
peach = "#DFAF8F"

[ui.sidebar.spaces]
rows = [
    ["state_icon", { token = "workspace", fg = "#DCDCCC", bold = true }],
    [{ token = "branch", fg = "#A7C7A0" }, "git_status"],
]

[experimental]
# Pane screen history restores recent terminal contents after a full server
# restart without restoring the old process.
pane_history = true

[session]
# Some agents can resume their own conversation sessions. Herdr can use official
# integration-reported session references to restart supported agent panes after
# a Herdr server restart.
resume_agents_on_restore = false
